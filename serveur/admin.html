<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TamagoChat · Centre de contrôle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>
:root {
  --bg: #faf6f1; --panel: #ffffff; --panel-2: #f4ede5; --ink: #2f241d; --muted: #8a7a6d;
  --line: #eadfd3; --accent: #e8893a; --accent-ink: #fff; --accent-soft: #fde9d6;
  --ok: #3fae5a; --off: #b9aea4; --danger: #c9433a; --reply: #eef1f6; --warn-bg: #fff3d6; --warn-ink: #7a5a12;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
  --s-satiete: #e8a23c; --s-hydratation: #4fa3e0; --s-bonheur: #e8557a; --s-energie: #6fbf5f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1714; --panel: #25201c; --panel-2: #2e2823; --ink: #f1e8df; --muted: #a39385;
    --line: #3a322b; --accent: #f0974a; --accent-ink: #1b1714; --accent-soft: #4a3220;
    --reply: #2f3540; --warn-bg: #3d3220; --warn-ink: #f0d59a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* connexion */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
#login .card { width: min(360px, 100%); padding: 28px; text-align: center; }
#login .cat { font-size: 52px; line-height: 1; }
#login h1 { font-size: 20px; margin: 10px 0 4px; }
#login p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
#login input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); margin-bottom: 10px; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13.5px; }
.btn.ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
#login .btn { width: 100%; }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

/* application */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
header .spacer { flex: 1; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 6px; }
.linkbtn:hover { color: var(--ink); }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 0; }

aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; background: var(--panel); }
.catitem { width: 100%; text-align: left; display: block; border: 1px solid transparent; background: none; border-radius: 12px; padding: 10px 12px; margin-bottom: 4px; }
.catitem:hover { background: var(--panel-2); }
.catitem.sel { background: var(--accent-soft); border-color: var(--accent); }
.catitem .row { display: flex; align-items: center; gap: 8px; }
.catitem .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catitem .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.unread { background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
.minibars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 7px; }
.minibars span { height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
.minibars i { display: block; height: 100%; }
.empty-side { color: var(--muted); font-size: 13.5px; padding: 12px; }

main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.cathead { padding: 16px 20px 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-start; }
.cathead h2 { margin: 0; font-size: 21px; }
.cathead .meta { color: var(--muted); font-size: 13.5px; }
.cathead .left { flex: 1 1 220px; }
.stats { display: grid; grid-template-columns: auto 140px 32px; gap: 3px 10px; align-items: center; font-size: 13px; }
.stats .bar { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; }
.stats .bar i { display: block; height: 100%; border-radius: 5px; }
.stats .v { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2.5px solid transparent; padding: 9px 12px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.sel { color: var(--ink); border-bottom-color: var(--accent); }

.pane-chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.actions { padding: 10px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; }
.actions .grp { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.actions .lbl { font-size: 12px; color: var(--muted); width: 58px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip:active { transform: translateY(1px); }

#feed { overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: min(560px, 85%); }
.msg .b { padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .m { font-size: 11.5px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
.msg.sent { align-self: flex-end; text-align: right; }
.msg.sent .b { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; text-align: left; }
.msg.reply { align-self: flex-start; }
.msg.reply .b { background: var(--reply); border-bottom-left-radius: 5px; }
.msg.action { align-self: center; text-align: center; max-width: 100%; }
.msg.action .b { display: inline-block; background: var(--panel-2); color: var(--muted); font-size: 13px; padding: 5px 12px; border-radius: 14px; }
.feed-empty { margin: auto; color: var(--muted); text-align: center; font-size: 14px; }

.composer { border-top: 1px solid var(--line); padding: 12px 20px 14px; background: var(--panel); display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.composer textarea { resize: none; height: 46px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.composer .opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--muted); }
.composer .opts input, .composer .opts select { padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; }
.composer .opts input { width: 150px; }
.composer .opts .spacer { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 10; }

/* réglages & phrases */
.pane { overflow-y: auto; padding: 18px 20px 28px; min-height: 0; }
.note { display: flex; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--panel-2); color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }
.card h3 { margin: 0; font-size: 15px; padding: 13px 16px 0; }
.card .body { padding: 10px 16px 14px; display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto 22px; align-items: center; gap: 10px; font-size: 14px; min-height: 32px; }
.field .pend { font-size: 13px; text-align: center; }
.field select, .field input[type=text], .namebox input { padding: 6px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px; max-width: 220px; }
.namebox { display: flex; gap: 8px; align-items: center; }
.namebox input { flex: 1; min-width: 0; max-width: none; }
.hint { font-size: 12.5px; color: var(--muted); }
.switch { position: relative; width: 42px; height: 24px; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 5px 11px; font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.gauge { display: grid; grid-template-columns: 96px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 14px; }
.gauge input[type=range] { width: 100%; }
.gauge .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.gauge.dirty .v { color: var(--accent); font-weight: 700; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.ph-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.ph-top select { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; max-width: 100%; }
.ph-info { color: var(--muted); font-size: 13px; flex: 1; min-width: 160px; }
.ph-list { list-style: none; margin: 0 0 12px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.ph-list li { display: flex; gap: 6px; align-items: center; padding: 8px 8px 8px 14px; border-top: 1px solid var(--line); }
.ph-list li:first-child { border-top: 0; }
.ph-list .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.ph-list input { flex: 1; min-width: 0; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--accent); background: var(--panel-2); font-size: 14px; }
.ph-list .empty { color: var(--muted); font-size: 13.5px; justify-content: center; padding: 16px; }
.ph-list.stale { opacity: .55; }
.ib { border: 0; background: none; border-radius: 8px; padding: 4px 7px; font-size: 15px; line-height: 1; flex: none; }
.ib:hover { background: var(--panel-2); }
.ph-add { display: flex; gap: 8px; }
.ph-add input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }

@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  #release { display: none; }
  header { gap: 8px; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; }
  .catitem { width: auto; min-width: 150px; margin: 0; }
  .minibars { display: none; }
  header, .cathead, .actions, #feed, .composer, .tabs, .pane { padding-left: 16px; padding-right: 16px; }
  .stats { grid-template-columns: auto 1fr 32px; width: 100%; }
  .actions .lbl { width: 100%; }
  .actions { max-height: 34vh; overflow-y: auto; }
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card" id="loginForm">
    <div class="cat">🐱</div>
    <h1>Centre de contrôle TamagoChat</h1>
    <p>Envoie des messages et des bêtises aux chats.</p>
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrer</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <h1>🐱 TamagoChat</h1>
    <span class="badge" id="online">…</span>
    <span class="spacer"></span>
    <span class="badge" id="release">…</span>
    <button class="linkbtn" id="logout">Se déconnecter</button>
  </header>
  <div class="layout">
    <aside id="cats"></aside>
    <main>
      <div class="cathead" id="cathead"></div>
      <nav class="tabs" id="tabs">
        <button class="tab sel" data-tab="chat">💬 Messages & actions</button>
        <button class="tab" data-tab="settings">⚙️ Réglages & jauges</button>
        <button class="tab" data-tab="phrases">🗨️ Phrases</button>
      </nav>
      <section class="pane-chat" id="paneChat">
        <div class="actions" id="actions"></div>
        <div id="feed"></div>
        <form class="composer" id="composer">
          <textarea id="text" maxlength="500" placeholder="Écris un message, il s'affichera dans la bulle du chat…"></textarea>
          <button class="btn" type="submit" id="sendBtn">Envoyer</button>
          <div class="opts">
            <label for="from">Signé :</label>
            <input id="from" maxlength="40" placeholder="ton prénom (facultatif)">
            <label for="secs">Bulle :</label>
            <select id="secs">
              <option value="">durée auto</option><option value="15">15 s</option><option value="30">30 s</option>
              <option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option>
            </select>
            <span class="spacer"></span>
            <span>Ctrl + Entrée pour envoyer</span>
          </div>
        </form>
      </section>
      <section class="pane hidden" id="paneSettings"></section>
      <section class="pane hidden" id="panePhrases"></section>
    </main>
  </div>
</section>

<script>
const ACTION_GROUPS = [
  ["Soins", [["feed", "🍗 Manger"], ["drink", "💧 Boire"], ["pet", "💗 Caresse"], ["love", "💞 Pluie de câlins"],
             ["play", "🧶 Pelote"], ["sleep", "😴 Sieste"], ["wake", "⏰ Réveiller"], ["meow", "🐾 Miaou"]]],
  ["Bêtises", [["crazy", "🌀 Crise de folie"], ["crazy_xl", "🌪️ Folie XXL (30 s)"], ["flies", "🪰 Mouches"],
               ["swarm", "🪰🪰 Nuée de mouches"], ["jump", "🦘 Grand saut"], ["drop", "☄️ Tomber du ciel"],
               ["screen", "🖥️ Changer d'écran"], ["mouse", "🖱️ Chasser la souris"], ["hide", "🙈 Cache-cache"]]],
];
const ACTION_LABEL = Object.fromEntries(ACTION_GROUPS.flatMap(g => g[1]));
const STATES = { idle: "tranquille", walk: "se promène", sleep: "dort", eat: "mange", drink: "boit",
  play: "joue à la pelote", pet: "se fait câliner", crazy: "fait une crise de folie !",
  hunt: "chasse une mouche", drag: "est porté", fall: "tombe", hidden: "joue à cache-cache 🙈" };
const STATS = [["satiete", "Satiété"], ["hydratation", "Hydratation"], ["bonheur", "Bonheur"], ["energie", "Énergie"]];
const STAT_LABEL = Object.fromEntries(STATS);
const CHATTER = [[30, "Très souvent (~30 s)"], [60, "Souvent (~1 min)"], [180, "Normal (~3 min)"],
  [600, "Rarement (~10 min)"], [1800, "Très rarement (~30 min)"], [0, "Jamais"]];
const CRAZY = [[0, "Désactivé"], [30, "Rarement (~30 min)"], [10, "Parfois (~10 min)"], [3, "Souvent (~3 min)"]];
const FLIES = [[0, "Désactivées"], [20, "Rarement (~20 min)"], [8, "Parfois (~8 min)"], [3, "Souvent (~3 min)"]];
const SIZES = ["Petit", "Moyen", "Grand"];
const SET_LABEL = { name: "Nom", autowalk: "Promenade", topmost: "Premier plan", size: "Taille",
  chatter_s: "Phrases spontanées", crazy_min: "Mode FOU", flies_min: "Mouches" };

let cats = [], selected = "*", tab = "chat", lastFeedKey = "", serverNow = Date.now() / 1000;
const pending = {};          // cat -> {réglage: {v, t}} : envoyé, pas encore confirmé par le chat
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const curCat = () => cats.find(x => x.id === selected);

async function api(path, body) {
  const opts = { credentials: "same-origin" };
  if (body !== undefined) Object.assign(opts, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const r = await fetch(path, opts);
  if (r.status === 401 && !path.endsWith("/login")) { show("login"); throw new Error("auth"); }
  if (!r.ok) throw new Error(await r.text() || r.statusText);
  return r.json();
}
function show(which) { $("login").classList.toggle("hidden", which !== "login"); $("app").classList.toggle("hidden", which !== "app"); }
function toast(msg) { const t = el("div", "toast", msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }
function ago(ts) {
  if (!ts) return "jamais";
  const s = Math.max(0, serverNow - ts);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return `il y a ${Math.floor(s / 86400)} j`;
}
const hhmm = (ts) => new Date(ts * 1000).toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit" });
function fmtDelay(s) { if (!s) return "jamais"; return s < 60 ? `${s} s` : `${+(s / 60).toFixed(1)} min`.replace(".", ","); }
function describeSetting(k, v) {
  if (k === "autowalk" || k === "topmost") return `${SET_LABEL[k]} : ${v ? "oui" : "non"}`;
  if (k === "chatter_s") return `${SET_LABEL[k]} : ${v ? "~" + fmtDelay(v) : "jamais"}`;
  if (k === "crazy_min" || k === "flies_min") return `${SET_LABEL[k]} : ${v ? "~" + v + " min" : "désactivé"}`;
  return `${SET_LABEL[k] || k} : ${v}`;
}

// ---------------------------------------------------------------- connexion
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("loginErr").textContent = "";
  try { await api("/admin/api/login", { password: $("pw").value }); $("pw").value = ""; start(); }
  catch (err) { $("loginErr").textContent = err.message === "auth" ? "" : err.message; }
});
$("logout").onclick = async () => { await api("/admin/api/logout", {}).catch(() => {}); show("login"); };

// ---------------------------------------------------------------- liste & en-tête
function renderCats() {
  const box = $("cats"); box.replaceChildren();
  const online = cats.filter(c => c.online).length;
  $("online").textContent = `${online} en ligne · ${cats.length} chat${cats.length > 1 ? "s" : ""}`;
  const all = el("button", "catitem" + (selected === "*" ? " sel" : ""));
  const r0 = el("div", "row"); r0.append(el("span", "name", "🐾 Tous les chats"));
  all.append(r0, el("div", "sub", "Message ou action pour tout le monde"));
  all.onclick = () => select("*"); box.append(all);
  if (!cats.length) box.append(el("div", "empty-side", "Aucun chat pour l'instant. Ils apparaissent ici dès que quelqu'un lance TamagoChat."));
  for (const c of cats) {
    const b = el("button", "catitem" + (selected === c.id ? " sel" : ""));
    const row = el("div", "row");
    row.append(el("span", "dot" + (c.online ? " on" : "")), el("span", "name", c.name));
    if (c.unread) row.append(el("span", "unread", c.unread));
    const sub = c.online ? (STATES[c.state] || c.state || "en ligne") : `vu ${ago(c.last_seen)}`;
    b.append(row, el("div", "sub", `${sub} · v${c.version || "?"}`));
    const mb = el("div", "minibars");
    for (const [k] of STATS) { const s = el("span"); const i = el("i"); i.style.width = (c.stats[k] ?? 0) + "%"; i.style.background = `var(--s-${k})`; s.append(i); mb.append(s); }
    b.append(mb); b.onclick = () => select(c.id); box.append(b);
  }
}
function renderHead() {
  const h = $("cathead"); h.replaceChildren();
  const left = el("div", "left");
  $("tabs").classList.toggle("hidden", selected === "*");
  if (selected === "*") {
    left.append(el("h2", null, "Tous les chats"), el("div", "meta", "Ce que tu envoies ici part vers chaque chat connu."));
    h.append(left); return;
  }
  const c = curCat();
  if (!c) { select("*"); return; }
  left.append(el("h2", null, c.name));
  const state = c.online ? `🟢 En ligne · ${STATES[c.state] || c.state || ""}` : `⚪ Hors ligne · vu ${ago(c.last_seen)}`;
  left.append(el("div", "meta", state));
  left.append(el("div", "meta", `Version ${c.version || "?"}${c.accept ? "" : " · messages désactivés de son côté"}`));
  const forget = el("button", "linkbtn", "Oublier ce chat");
  forget.onclick = async () => { if (confirm(`Retirer ${c.name} de la liste ? (il réapparaîtra s'il se reconnecte)`)) { await api("/admin/api/forget", { cat: c.id }); select("*"); refresh(); } };
  left.append(forget);
  const st = el("div", "stats");
  for (const [k, label] of STATS) {
    const v = c.stats[k] ?? 0; const bar = el("div", "bar"); const i = el("i"); i.style.width = v + "%"; i.style.background = `var(--s-${k})`; bar.append(i);
    st.append(el("span", null, label), bar, el("span", "v", Math.round(v)));
  }
  h.append(left, st);
}
function renderActions() {
  const a = $("actions"); a.replaceChildren();
  for (const [title, list] of ACTION_GROUPS) {
    const g = el("div", "grp"); g.append(el("span", "lbl", title));
    for (const [key, label] of list) { const b = el("button", "chip", label); b.onclick = () => send({ kind: "action", action: key }); g.append(b); }
    a.append(g);
  }
}

// ---------------------------------------------------------------- conversation
function describeItem(it) {
  if (it.kind === "action") return ACTION_LABEL[it.action] || it.action;
  if (it.kind === "settings") return "⚙️ " + Object.entries(it.settings || {}).map(([k, v]) => describeSetting(k, v)).join(" · ");
  if (it.kind === "stats") return "📊 Jauges → " + Object.entries(it.stats || {}).map(([k, v]) => `${STAT_LABEL[k] || k} ${v}`).join(" · ");
  if (it.kind === "phrases") {
    const label = phr.data?.cats?.find(c => c[0] === it.key)?.[1] || it.key;
    return `🗨️ Phrases « ${label} » : ` + (it.reset ? "remises d'origine" : `${(it.list || []).length} phrase(s)`);
  }
  return it.kind;
}
function renderFeed(items) {
  const f = $("feed");
  const key = selected + JSON.stringify(items.map(i => [i.type, i.id, i.fetched, i.delivered]));
  if (key === lastFeedKey) return; lastFeedKey = key;
  const nearBottom = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.replaceChildren();
  if (!items.length) { f.append(el("div", "feed-empty", "Pas encore de messages. Dis bonjour ! 👋")); return; }
  const many = selected === "*";
  for (const it of items) {
    if (it.type === "reply") {
      const m = el("div", "msg reply"); m.append(el("div", "b", it.text), el("div", "m", `${it.cat} · ${hhmm(it.created)}`)); f.append(m); continue;
    }
    const status = it.delivered ? "reçu ✓✓" : it.fetched ? "envoyé ✓" : "en attente…";
    const who = many ? `${it.cat} · ` : "";
    if (it.kind === "say") {
      const extra = (it.from ? "signé " + it.from + " · " : "") + (it.secs ? `bulle ${fmtDelay(it.secs)} · ` : "");
      const m = el("div", "msg sent"); m.append(el("div", "b", it.text), el("div", "m", `${who}${extra}${hhmm(it.created)} · ${status}`)); f.append(m);
    } else {
      const m = el("div", "msg action"); m.append(el("div", "b", `${describeItem(it)} · ${who}${status}`)); f.append(m);
    }
  }
  if (nearBottom || !f.dataset.init) { f.scrollTop = f.scrollHeight; f.dataset.init = "1"; }
}

// ---------------------------------------------------------------- onglets
function setTab(t) {
  tab = selected === "*" ? "chat" : t;
  for (const b of document.querySelectorAll(".tab")) b.classList.toggle("sel", b.dataset.tab === tab);
  $("paneChat").classList.toggle("hidden", tab !== "chat");
  $("paneSettings").classList.toggle("hidden", tab !== "settings");
  $("panePhrases").classList.toggle("hidden", tab !== "phrases");
  if (tab === "settings") renderSettings(true);
  if (tab === "phrases") loadPhrases(true);
  if (tab === "chat") { lastFeedKey = ""; refreshFeed(); }
}
for (const b of document.querySelectorAll(".tab")) b.onclick = () => setTab(b.dataset.tab);

function note(icon, text, cls) { const n = el("div", "note" + (cls ? " " + cls : "")); n.append(el("span", null, icon), el("span", null, text)); return n; }
function blockedNotes(c, box) {
  if (!c.settings) { box.append(note("⏳", `${c.name} a encore une ancienne version (v${c.version || "?"}). Cette partie arrive avec la v1.1 : il se mettra à jour tout seul dès qu'il sera allumé.`)); return true; }
  if (c.allow_settings === false) box.append(note("🔒", `${c.name} a désactivé « Autoriser les réglages à distance » de son côté : tes changements ne seront pas appliqués.`, "warn"));
  else if (!c.online) box.append(note("💤", `${c.name} est hors ligne : les changements seront appliqués à sa prochaine connexion.`));
  return false;
}

// ---------------------------------------------------------------- réglages
let setSig = "", ctls = {}, gauges = {}, statsPending = null;
function renderSettings(force) {
  const c = curCat(); if (!c) return;
  const sig = [c.id, !!c.settings, c.allow_settings, c.online].join("|");
  if (force || sig !== setSig) { setSig = sig; buildSettings(c); }
  if (c.settings) updateSettings(c);
}
function sendSettings(obj) {
  const c = curCat(); if (!c) return;
  const p = pending[c.id] ||= {};
  for (const [k, v] of Object.entries(obj)) p[k] = { v, t: Date.now() };
  send({ kind: "settings", settings: obj }); updateSettings(c);
}
function field(label, control, key, hint) {
  const f = el("div", "field"); const l = el("div"); l.append(el("div", null, label)); if (hint) l.append(el("div", "hint", hint));
  const pend = el("span", "pend"); f.append(l, control, pend); ctls[key].pendEl = pend; return f;
}
function makeSwitch(key) {
  const lab = el("label", "switch"); const inp = el("input"); inp.type = "checkbox"; lab.append(inp, el("span"));
  inp.onchange = () => sendSettings({ [key]: inp.checked });
  ctls[key] = { el: inp, set: (v) => { inp.checked = !!v; } };
  return lab;
}
function makeSelect(key, presets, unit) {
  const s = el("select");
  const fill = (cur) => {
    s.replaceChildren();
    for (const [v, label] of presets) { const o = el("option", null, label); o.value = v; s.append(o); }
    if (cur != null && !presets.some(p => p[0] === cur)) { const o = el("option", null, `Personnalisé (${unit === "s" ? fmtDelay(cur) : cur + " min"})`); o.value = cur; s.append(o); }
    const o = el("option", null, "Autre…"); o.value = "custom"; s.append(o);
    s.value = cur;
  };
  s.onchange = () => {
    let v = s.value;
    if (v === "custom") {
      const ans = prompt(unit === "s" ? "Toutes les combien de minutes ? (0 = jamais)" : "Environ toutes les combien de minutes ? (0 = jamais)");
      const n = ans == null ? NaN : parseFloat(ans.replace(",", "."));
      if (!isFinite(n) || n < 0) { fill(ctls[key].cur); return; }
      v = unit === "s" ? (n === 0 ? 0 : Math.max(15, Math.min(86400, Math.round(n * 60)))) : Math.min(1440, Math.round(n));
    }
    sendSettings({ [key]: Number(v) });
  };
  ctls[key] = { el: s, set: (v) => { if (ctls[key].cur !== v || s.value !== String(v)) { ctls[key].cur = v; fill(v); } } };
  return s;
}
function makeSeg(key, values) {
  const box = el("div", "seg"); const btns = {};
  for (const v of values) { const b = el("button", null, v); b.type = "button"; b.onclick = () => sendSettings({ [key]: v }); btns[v] = b; box.append(b); }
  ctls[key] = { el: box, set: (v) => { for (const [k, b] of Object.entries(btns)) b.classList.toggle("on", k === v); } };
  return box;
}
function buildSettings(c) {
  const p = $("paneSettings"); p.replaceChildren(); ctls = {}; gauges = {};
  if (blockedNotes(c, p)) return;
  const grid = el("div", "cards"); p.append(grid);

  // identité
  const idc = el("div", "card"); idc.append(el("h3", null, "🏷️ Nom du chat"));
  const ib = el("div", "body"); const nb = el("div", "namebox");
  const inp = el("input"); inp.type = "text"; inp.maxLength = 24; inp.placeholder = "Nouveau nom";
  const go = el("button", "btn small", "Renommer"); const pend = el("span", "pend");
  const rename = () => { const v = inp.value.trim(); if (v && v !== c.name) sendSettings({ name: v }); inp.blur(); };
  go.onclick = rename; inp.onkeydown = (e) => { if (e.key === "Enter") rename(); };
  nb.append(inp, go, pend); ib.append(nb, el("div", "hint", "Il annoncera lui-même son nouveau nom."));
  idc.append(ib); grid.append(idc);
  ctls.name = { el: inp, pendEl: pend, set: (v) => { inp.value = v; } };

  // jauges
  const gc = el("div", "card"); gc.append(el("h3", null, "📊 Jauges"));
  const gb = el("div", "body");
  for (const [k, label] of STATS) {
    const row = el("div", "gauge"); const r = el("input"); r.type = "range"; r.min = 0; r.max = 100; r.step = 1;
    r.style.accentColor = `var(--s-${k})`;
    const v = el("span", "v");
    r.oninput = () => { gauges[k].dirty = true; row.classList.add("dirty"); v.textContent = r.value; };
    row.append(el("span", null, label), r, v); gb.append(row);
    gauges[k] = { r, v, row, dirty: false };
  }
  const btns = el("div", "row-btns");
  const apply = el("button", "btn small", "Appliquer");
  const full = el("button", "btn small ghost", "💯 Tout à fond");
  const gp = el("span", "hint");
  const sendStats = (vals) => { statsPending = { cat: c.id, vals, t: Date.now() }; send({ kind: "stats", stats: vals }); for (const g of Object.values(gauges)) { g.dirty = false; g.row.classList.remove("dirty"); } updateSettings(curCat()); };
  apply.onclick = () => sendStats(Object.fromEntries(STATS.map(([k]) => [k, Number(gauges[k].r.value)])));
  full.onclick = () => sendStats(Object.fromEntries(STATS.map(([k]) => [k, 100])));
  btns.append(apply, full, gp); gb.append(btns); gc.append(gb); grid.append(gc);
  gauges._status = gp;

  // comportement
  const bc = el("div", "card"); bc.append(el("h3", null, "🐾 Comportement"));
  const bb = el("div", "body");
  bb.append(
    field("Phrases spontanées", makeSelect("chatter_s", CHATTER, "s"), "chatter_s", "Les réponses aux actions ne sont pas concernées."),
    field("Mode FOU", makeSelect("crazy_min", CRAZY, "min"), "crazy_min", "Crises de folie automatiques."),
    field("Mouches", makeSelect("flies_min", FLIES, "min"), "flies_min"),
    field("Se promène tout seul", makeSwitch("autowalk"), "autowalk"),
    field("Toujours au premier plan", makeSwitch("topmost"), "topmost"),
    field("Taille", makeSeg("size", SIZES), "size"),
  );
  bc.append(bb); grid.append(bc);
  const off = c.allow_settings === false;
  for (const e of p.querySelectorAll("input, select, button")) e.disabled = off;
}
function updateSettings(c) {
  if (!c || !c.settings || !ctls.name) return;
  const pend = pending[c.id] || {};
  for (const [k, ctl] of Object.entries(ctls)) {
    const reported = k === "name" ? c.name : c.settings[k];
    if (pend[k] && pend[k].v === reported) delete pend[k];
    const shown = pend[k] ? pend[k].v : reported;
    if (document.activeElement !== ctl.el) ctl.set(shown);
    ctl.pendEl.textContent = pend[k] ? (Date.now() - pend[k].t > 30000 ? "⚠️" : "⏳") : "";
    ctl.pendEl.title = pend[k] ? (Date.now() - pend[k].t > 30000 ? "Pas encore appliqué (chat hors ligne ?)" : "Envoyé, en attente du chat…") : "";
  }
  let sp = statsPending && statsPending.cat === c.id ? statsPending : null;
  if (sp && (STATS.every(([k]) => Math.abs((c.stats[k] ?? -99) - sp.vals[k]) < 2) || Date.now() - sp.t > 30000)) { statsPending = sp = null; }
  for (const [k] of STATS) {
    const g = gauges[k]; if (!g || g.dirty) continue;
    const v = Math.round(sp ? sp.vals[k] : (c.stats[k] ?? 0));
    if (document.activeElement !== g.r) g.r.value = v;
    g.v.textContent = v;
  }
  if (gauges._status) gauges._status.textContent = sp ? "⏳ envoi…" : "";
}

// ---------------------------------------------------------------- phrases
let phr = { cat: null, data: null, at: null, key: null, local: {}, editing: -1, built: "" };
async function loadPhrases(force) {
  const c = curCat(); if (!c) return;
  if (phr.cat !== c.id) { phr = { cat: c.id, data: null, at: null, key: null, local: {}, editing: -1, built: "" }; force = true; }
  try {
    const r = await api("/admin/api/phrases?cat=" + encodeURIComponent(c.id));
    if (phr.cat !== c.id) return;
    if (force || r.at !== phr.at) { phr.data = r.phrases; phr.at = r.at; }
    renderPhrases(force);
  } catch (e) { if (e.message !== "auth") console.warn(e); }
}
function phrList(key) {
  const loc = phr.local[key];
  if (loc && !loc.reset) return loc.list;
  return phr.data?.list?.[key] || [];
}
function setPhrases(key, list) {
  phr.local[key] = { list, t: Date.now() };
  send({ kind: "phrases", key, list }); phr.editing = -1; renderPhrases();
}
function renderPhrases(force) {
  const c = curCat(); const p = $("panePhrases"); if (!c) return;
  const sig = [c.id, !!c.settings, c.allow_settings, c.online, !!phr.data].join("|");
  if (force || sig !== phr.built) {
    phr.built = sig; p.replaceChildren();
    if (blockedNotes(c, p)) return;
    if (!phr.data) { p.append(note("⏳", `${c.name} n'a pas encore envoyé ses phrases : elles arrivent dès qu'il est en ligne.`)); return; }
    const top = el("div", "ph-top");
    const sel = el("select"); sel.id = "ph_cat";
    sel.onchange = () => { phr.key = sel.value; phr.editing = -1; renderPhrases(); };
    const info = el("span", "ph-info"); info.id = "ph_info";
    const reset = el("button", "btn small ghost", "↺ Rétablir l'origine"); reset.id = "ph_reset";
    reset.onclick = () => { if (confirm("Remettre les phrases d'origine pour cette situation ?")) { phr.local[phr.key] = { reset: true, t: Date.now() }; send({ kind: "phrases", key: phr.key, reset: true }); renderPhrases(); } };
    top.append(sel, info, reset);
    const ul = el("ul", "ph-list"); ul.id = "ph_list";
    const add = el("form", "ph-add");
    const ai = el("input"); ai.maxLength = 200; ai.placeholder = "Nouvelle phrase… (écris {name} pour son nom)";
    const ab = el("button", "btn small", "Ajouter"); add.append(ai, ab);
    add.onsubmit = (e) => { e.preventDefault(); const t = ai.value.trim(); if (!t) return; setPhrases(phr.key, [...phrList(phr.key), t]); ai.value = ""; ai.focus(); };
    p.append(top, ul, add, el("div", "hint", "Chaque modification est envoyée au chat tout de suite. 💬 = la lui faire dire maintenant."));
    if (c.allow_settings === false) for (const e of p.querySelectorAll("input, select, button")) e.disabled = true;
  }
  if (!phr.data || !$("ph_list")) return;
  // les changements confirmés par le chat ne sont plus « en attente »
  for (const [k, loc] of Object.entries(phr.local)) {
    const done = loc.reset ? !phr.data.custom.includes(k)
                           : JSON.stringify(phr.data.list[k] || []) === JSON.stringify(loc.list);
    if (done) delete phr.local[k];
  }
  const cats_ = phr.data.cats;
  if (!phr.key || !cats_.some(x => x[0] === phr.key)) phr.key = cats_[0]?.[0];
  const sel = $("ph_cat");
  const opts = cats_.map(([k, label]) => `${k}|${label}|${phrList(k).length}|${phr.data.custom.includes(k)}`).join("\n");
  if (sel.dataset.opts !== opts) {
    sel.dataset.opts = opts; sel.replaceChildren();
    for (const [k, label] of cats_) { const o = el("option", null, `${phr.data.custom.includes(k) ? "★ " : ""}${label} (${phrList(k).length})`); o.value = k; sel.append(o); }
  }
  sel.value = phr.key;
  const key = phr.key, loc = phr.local[key], list = phrList(key);
  const custom = phr.data.custom.includes(key);
  let info = `${list.length} phrase${list.length > 1 ? "s" : ""} · ${custom ? "personnalisées ★" : "d'origine"}`;
  if (loc) info += Date.now() - loc.t > 30000 ? " · ⚠️ pas encore appliqué" : " · ⏳ envoi au chat…";
  $("ph_info").textContent = info;
  $("ph_reset").classList.toggle("hidden", !custom && !loc?.reset);
  if (phr.editing >= 0) return;            // ne pas effacer une modification en cours
  const ul = $("ph_list"); ul.replaceChildren(); ul.classList.toggle("stale", !!loc?.reset);
  if (!list.length) { const li = el("li", "empty", "Aucune phrase : il ne dira rien dans cette situation."); ul.append(li); }
  const off = c.allow_settings === false;
  list.forEach((text, i) => {
    const li = el("li"); const t = el("span", "t", text);
    const say = el("button", "ib", "💬"); say.title = "Lui faire dire maintenant";
    say.onclick = () => send({ kind: "say", text }).then(ok => ok && toast("Envoyé !"));
    const ed = el("button", "ib", "✏️"); ed.title = "Modifier";
    const del = el("button", "ib", "🗑️"); del.title = "Supprimer";
    del.onclick = () => setPhrases(key, list.filter((_, j) => j !== i));
    ed.onclick = () => {
      phr.editing = i; const inp = el("input"); inp.value = text; inp.maxLength = 200;
      const save = el("button", "ib", "✔️"); save.title = "Enregistrer"; const cancel = el("button", "ib", "✖️"); cancel.title = "Annuler";
      const commit = () => { const v = inp.value.trim(); if (v && v !== text) setPhrases(key, list.map((x, j) => j === i ? v : x)); else { phr.editing = -1; renderPhrases(); } };
      save.onclick = commit; cancel.onclick = () => { phr.editing = -1; renderPhrases(); };
      inp.onkeydown = (e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") cancel.onclick(); };
      li.replaceChildren(inp, save, cancel); inp.focus();
    };
    for (const b of [ed, del]) b.disabled = off;
    li.append(t, say, ed, del); ul.append(li);
  });
}

// ---------------------------------------------------------------- données
function select(id) {
  selected = id; lastFeedKey = ""; $("feed").dataset.init = ""; setSig = "";
  renderCats(); renderHead(); setTab(id === "*" ? "chat" : tab);
}
async function refresh() {
  try {
    const s = await api("/admin/api/state");
    cats = s.cats; serverNow = s.now;
    $("release").textContent = s.release ? `Version publiée : v${s.release.version}` : "Aucune version publiée";
    renderCats(); renderHead();
    if (tab === "settings") renderSettings();
    if (tab === "phrases") loadPhrases();
  } catch (e) { if (e.message !== "auth") console.warn(e); }
}
async function refreshFeed() {
  if (tab !== "chat") return;
  try { const r = await api("/admin/api/feed?cat=" + encodeURIComponent(selected)); renderFeed(r.items); }
  catch (e) { if (e.message !== "auth") console.warn(e); }
}
async function send(payload) {
  try {
    const r = await api("/admin/api/send", { cat: selected, ...payload });
    if (!r.sent) toast("Aucun chat à qui l'envoyer.");
    else if (tab !== "chat" && payload.kind === "action") toast("Envoyé !");
    refreshFeed();
    return true;
  } catch (e) { if (e.message !== "auth") toast("Erreur : " + e.message); return false; }
}
$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim(); if (!text) return;
  $("sendBtn").disabled = true;
  const payload = { kind: "say", text, from: $("from").value.trim() };
  if ($("secs").value) payload.secs = Number($("secs").value);
  if (await send(payload)) $("text").value = "";
  $("sendBtn").disabled = false; $("text").focus();
});
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("composer").requestSubmit(); });
try { $("from").value = localStorage.getItem("minou_from") || ""; } catch {}
$("from").addEventListener("input", () => { try { localStorage.setItem("minou_from", $("from").value); } catch {} });

let timer = null;
async function start() {
  try { await api("/admin/api/state"); } catch { return; }   // 401 -> écran de connexion
  show("app"); renderActions(); await refresh(); setTab("chat");
  clearInterval(timer);
  timer = setInterval(() => { refresh(); refreshFeed(); }, 3000);
}
start();
</script>
</body>
</html>
