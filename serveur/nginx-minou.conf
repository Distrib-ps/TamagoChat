# TamagoChat : https://TON-DOMAINE  -> service local 127.0.0.1:8090
server {
    listen 80;
    listen [::]:80;
    server_name TON-DOMAINE;
    location /.well-known/acme-challenge/ { root /var/www/minou-acme; }
    location / { return 301 https://$host$request_uri; }
}
